name: CI - Ink Manager

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-app-changes:
    name: Detectar alterações implantáveis
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.detect.outputs.app_changed }}
    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar mudanças em ink-manager-api
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
            echo "Não foi possível localizar o commit anterior do push; deploy bloqueado." >&2
            exit 1
          fi

          # Deploy only when files consumed by the production image/runtime changed.
          # Documentation and test-only changes under ink-manager-api must not redeploy.
          if git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- \
            ink-manager-api/.dockerignore \
            ink-manager-api/.mvn/ \
            ink-manager-api/Dockerfile \
            ink-manager-api/compose.production.yml \
            ink-manager-api/deploy/ \
            ink-manager-api/mvnw \
            ink-manager-api/pom.xml \
            ink-manager-api/src/; then
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          else
            diff_status=$?
            if [[ "$diff_status" -eq 1 ]]; then
              echo "app_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Falha ao comparar os caminhos implantáveis; deploy bloqueado." >&2
              exit "$diff_status"
            fi
          fi

  test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ink-manager-api

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes
        run: ./mvnw clean test

  deploy-production:
    name: Deploy VPS (producao)
    needs: [test, detect-app-changes]
    if: github.ref == 'refs/heads/main' && needs.detect-app-changes.outputs.app_changed == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: marcae-production
      cancel-in-progress: false
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar deploy SSH e release
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "Missing required repository secret: VPS_SSH_KEY" >&2
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' '179.199.155.163 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILWnXNw3bUdWZoj/5o/uZ00R7E1CsFwaI0I98+UmvPhz' > "$HOME/.ssh/known_hosts"
          key_file="$RUNNER_TEMP/marcae-vps-key"
          trap 'rm -f "$key_file" "$RUNNER_TEMP/marcae-release.tar.gz"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"

          git archive --format=tar.gz "$GITHUB_SHA" ink-manager-api > "$RUNNER_TEMP/marcae-release.tar.gz"
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@179.199.155.163 \
            "install -d -m 700 /opt/marcae/incoming"
          scp -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/marcae-release.tar.gz" root@179.199.155.163:"/opt/marcae/incoming/$GITHUB_SHA.tar.gz"
          scp -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "ink-manager-api/deploy/deploy-release.sh" root@179.199.155.163:"/opt/marcae/incoming/deploy-release.sh"
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@179.199.155.163 \
            "bash /opt/marcae/incoming/deploy-release.sh $GITHUB_SHA"
