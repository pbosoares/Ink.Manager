<svg xmlns="http://www.w3.org/2000/svg" width="329" height="430" viewBox="0 0 329 430">
      <title>Simulação mobile de uma reserva online</title>
      <desc>Prévia demonstrativa com dados fictícios; nenhuma reserva é enviada.</desc>
      <style>
        .demo-placeholder { opacity:0; }
        .demo-value,.demo-confirmation,.demo-button-done,.demo-check { opacity:1; }
        .demo-focus,.demo-cursor,.demo-button-idle { opacity:0; }
        @keyframes ph-service { 0%,8% {opacity:1} 11%,94% {opacity:0} 98%,100% {opacity:1} }
        @keyframes val-service { 0%,9% {opacity:0} 12%,94% {opacity:1} 98%,100% {opacity:0} }
        @keyframes ph-pro { 0%,18% {opacity:1} 21%,94% {opacity:0} 98%,100% {opacity:1} }
        @keyframes val-pro { 0%,19% {opacity:0} 22%,94% {opacity:1} 98%,100% {opacity:0} }
        @keyframes ph-date { 0%,28% {opacity:1} 31%,94% {opacity:0} 98%,100% {opacity:1} }
        @keyframes val-date { 0%,29% {opacity:0} 32%,94% {opacity:1} 98%,100% {opacity:0} }
        @keyframes ph-slots { 0%,38% {opacity:1} 41%,94% {opacity:0} 98%,100% {opacity:1} }
        @keyframes val-slots { 0%,39% {opacity:0} 42%,94% {opacity:1} 98%,100% {opacity:0} }
        @keyframes ph-name { 0%,51% {opacity:1} 54%,94% {opacity:0} 98%,100% {opacity:1} }
        @keyframes val-name { 0%,52% {opacity:0} 55%,94% {opacity:1} 98%,100% {opacity:0} }
        @keyframes ph-email { 0%,57% {opacity:1} 60%,94% {opacity:0} 98%,100% {opacity:1} }
        @keyframes val-email { 0%,58% {opacity:0} 61%,94% {opacity:1} 98%,100% {opacity:0} }
        @keyframes ph-phone { 0%,63% {opacity:1} 66%,94% {opacity:0} 98%,100% {opacity:1} }
        @keyframes val-phone { 0%,64% {opacity:0} 67%,94% {opacity:1} 98%,100% {opacity:0} }
        @keyframes focus-service { 0%,7% {opacity:0} 8%,11% {opacity:1} 14%,100% {opacity:0} }
        @keyframes focus-pro { 0%,17% {opacity:0} 18%,21% {opacity:1} 24%,100% {opacity:0} }
        @keyframes focus-date { 0%,27% {opacity:0} 28%,31% {opacity:1} 34%,100% {opacity:0} }
        @keyframes focus-slots { 0%,38% {opacity:0} 39%,43% {opacity:1} 46%,100% {opacity:0} }
        @keyframes focus-name { 0%,50% {opacity:0} 51%,55% {opacity:1} 58%,100% {opacity:0} }
        @keyframes focus-submit { 0%,76% {opacity:0} 78%,81% {opacity:1} 84%,100% {opacity:0} }
        @keyframes demo-cursor {
          0%,6% {opacity:0;transform:translate(0,0)}
          8%,10% {opacity:1;transform:translate(42px,151px)}
          18%,20% {opacity:1;transform:translate(42px,185px)}
          28%,30% {opacity:1;transform:translate(194px,185px)}
          39%,42% {opacity:1;transform:translate(75px,216px)}
          51%,54% {opacity:1;transform:translate(42px,251px)}
          76%,81% {opacity:1;transform:translate(146px,382px) scale(.9)}
          84%,100% {opacity:0;transform:translate(146px,382px) scale(.9)}
        }
        @keyframes demo-confirmation { 0%,80% {opacity:0} 83%,94% {opacity:1} 98%,100% {opacity:0} }
        @keyframes demo-check { 0%,64% {opacity:0} 67%,94% {opacity:1} 98%,100% {opacity:0} }
        @keyframes demo-idle { 0%,79% {opacity:1} 82%,100% {opacity:0} }
        @keyframes demo-done { 0%,80% {opacity:0} 83%,94% {opacity:1} 98%,100% {opacity:0} }
        @media (prefers-reduced-motion:no-preference) {
          .demo-placeholder,.demo-value,.demo-focus,.demo-cursor,.demo-confirmation,.demo-button-idle,.demo-button-done,.demo-check { animation-duration:12s; animation-iteration-count:infinite; animation-timing-function:ease-in-out; animation-fill-mode:both; }
          .ph-service {animation-name:ph-service}.val-service {animation-name:val-service}.ph-pro {animation-name:ph-pro}.val-pro {animation-name:val-pro}
          .ph-date {animation-name:ph-date}.val-date {animation-name:val-date}.ph-slots {animation-name:ph-slots}.val-slots {animation-name:val-slots}
          .ph-name {animation-name:ph-name}.val-name {animation-name:val-name}.ph-email {animation-name:ph-email}.val-email {animation-name:val-email}
          .ph-phone {animation-name:ph-phone}.val-phone {animation-name:val-phone}.focus-service {animation-name:focus-service}.focus-pro {animation-name:focus-pro}
          .focus-date {animation-name:focus-date}.focus-slots {animation-name:focus-slots}.focus-name {animation-name:focus-name}.focus-submit {animation-name:focus-submit}
          .demo-cursor {display:block;animation-name:demo-cursor;transform-box:fill-box;transform-origin:top left}
          .demo-confirmation {animation-name:demo-confirmation}.demo-button-idle {animation-name:demo-idle}.demo-button-done {animation-name:demo-done}.demo-check {animation-name:demo-check}
        }
      </style>
