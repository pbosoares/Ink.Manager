<svg xmlns="http://www.w3.org/2000/svg" width="329" height="280" viewBox="0 0 329 280" style="width:100%;height:280px;flex-shrink:0">
  <title>Agenda da equipe Marcaê em uma tela mobile</title>
  <desc>Prévia mobile da agenda com três profissionais; os atendimentos aparecem em sequência e o horário atual pulsa suavemente.</desc>
  <style>
    @keyframes bookingIn { 0% { opacity: 0; transform: translateY(6px) scale(.985); } 72% { opacity: 1; transform: translateY(-1px) scale(1); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes linePulse { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
    @keyframes timeAdvance { from { transform: translateY(-23px); } to { transform: translateY(0); } }
    @keyframes nowPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes metricFirst { 0%,34% { opacity: 1; transform: translateY(0); } 46%,100% { opacity: 0; transform: translateY(-3px); } }
    @keyframes metricMiddle { 0%,34% { opacity: 0; transform: translateY(3px); } 44%,55% { opacity: 1; transform: translateY(0); } 68%,100% { opacity: 0; transform: translateY(-3px); } }
    @keyframes metricFinal { 0%,59% { opacity: 0; transform: translateY(3px); } 73%,100% { opacity: 1; transform: translateY(0); } }
    .metric-first,.metric-middle { opacity: 0; } .metric-final { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .metric-first { animation: metricFirst 1.1s ease .1s both; }
      .metric-middle { animation: metricMiddle 1.1s ease .1s both; }
      .metric-final { animation: metricFinal 1.1s cubic-bezier(.2,.75,.25,1) .1s both; }
      .booking { transform-box: fill-box; transform-origin: center; animation: bookingIn .7s cubic-bezier(.2,.75,.25,1) both; }
      .booking-1 { animation-delay: .25s; } .booking-2 { animation-delay: .65s; } .booking-3 { animation-delay: 1.05s; }
      .time-advance { animation: timeAdvance 1.8s cubic-bezier(.2,.75,.25,1) .5s both; }
      .live-line { animation: linePulse 2.4s ease-in-out 1s infinite; }
      .now-pill { transform-box: fill-box; transform-origin: center; animation: nowPulse 2.4s ease-in-out 1s infinite; }
    }
  </style>
  <defs>
    <linearGradient id="confirmedFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F8FF"/><stop offset="1" stop-color="#E8F1FF"/></linearGradient>
    <linearGradient id="pendingFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9EB"/><stop offset="1" stop-color="#FFF0CC"/></linearGradient>
    <linearGradient id="altFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF4FF"/><stop offset="1" stop-color="#F0E4FF"/></linearGradient>
    <filter id="cardShadow" x="-12%" y="-20%" width="124%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.8" flood-color="#25385E" flood-opacity=".10"/></filter>
  </defs>
  <rect width="329" height="280" rx="12" fill="#F4F6FB"/>
  <rect x=".5" y=".5" width="328" height="279" rx="11.5" fill="none" stroke="#DCE4F1"/>
  <rect width="329" height="28" rx="12" fill="#FFF"/><rect y="19" width="329" height="9" fill="#FFF"/><line y1="28.5" x2="329" y2="28.5" stroke="#E3E9F2"/>
  <path d="m15 19 5-10 5 7 6-9" fill="none" stroke="#1685FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="37" y="17.5" font-family="Inter,system-ui,sans-serif" font-size="7.2" font-weight="700" letter-spacing=".5" fill="#34425A">MARCAÊ · PAINEL DO NEGÓCIO</text>
  <circle cx="296" cy="14" r="3" fill="#31A875"/><text x="304" y="17" font-family="Inter,system-ui,sans-serif" font-size="6.4" font-weight="550" fill="#34425A">Hoje</text>
  <text x="14" y="44" font-family="Inter,system-ui,sans-serif" font-size="6.2" font-weight="700" letter-spacing=".9" fill="#0877F9">VISÃO GERAL</text>
  <text x="14" y="66" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="760" letter-spacing="-.55" fill="#171B2A">Agenda da <tspan fill="#0877F9">equipe</tspan></text>
  <text x="14" y="79" font-family="Inter,system-ui,sans-serif" font-size="7.7" fill="#69768B">Atendimentos e horários, em um só lugar.</text>

  <g font-family="Inter,system-ui,sans-serif">
    <rect x="12" y="88" width="96" height="35" rx="7" fill="#FFF" stroke="#E4E9F2"/><rect x="116" y="88" width="96" height="35" rx="7" fill="#FFF" stroke="#E4E9F2"/><rect x="220" y="88" width="97" height="35" rx="7" fill="#FFF" stroke="#E4E9F2"/>
    <circle cx="25" cy="105" r="8" fill="#EAF2FF"/><path d="M22 102h6v6h-6zM22 104h6" fill="none" stroke="#0877F9" stroke-width=".8"/>
    <text x="37" y="102" font-size="5.8" font-weight="650" fill="#52617A">Atendimentos</text><text class="metric-first" x="37" y="114" font-size="13" font-weight="750" fill="#171B2A">00</text><text class="metric-middle" x="37" y="114" font-size="13" font-weight="750" fill="#171B2A">05</text><text class="metric-final" x="37" y="114" font-size="13" font-weight="750" fill="#171B2A">10</text>
    <circle cx="129" cy="105" r="8" fill="#EAF2FF"/><path d="m126 105 2 2 4-5" fill="none" stroke="#0877F9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="141" y="102" font-size="5.8" font-weight="650" fill="#52617A">A confirmar</text><text class="metric-first" x="141" y="114" font-size="13" font-weight="750" fill="#171B2A">00</text><text class="metric-middle" x="141" y="114" font-size="13" font-weight="750" fill="#171B2A">02</text><text class="metric-final" x="141" y="114" font-size="13" font-weight="750" fill="#171B2A">04</text>
    <circle cx="233" cy="105" r="8" fill="#EAF2FF"/><path d="m230 105 2 2 4-5" fill="none" stroke="#0877F9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="245" y="102" font-size="5.8" font-weight="650" fill="#52617A">Concluídos</text><text class="metric-first" x="245" y="114" font-size="13" font-weight="750" fill="#171B2A">00</text><text class="metric-middle" x="245" y="114" font-size="13" font-weight="750" fill="#171B2A">01</text><text class="metric-final" x="245" y="114" font-size="13" font-weight="750" fill="#171B2A">03</text>
  </g>

  <rect x="12" y="132" width="305" height="136" rx="10" fill="#FFF" stroke="#E3E8F1" filter="url(#cardShadow)"/>
  <text x="24" y="148" font-family="Inter,system-ui,sans-serif" font-size="9.3" font-weight="750" fill="#171B2A">Agenda da equipe</text>
  <text x="262" y="148" font-family="Inter,system-ui,sans-serif" font-size="5.7" font-weight="600" fill="#69768B">3 profissionais</text>
  <line x1="24" y1="154" x2="305" y2="154" stroke="#EDF0F6"/>
  <g font-family="Inter,system-ui,sans-serif">
    <circle cx="39" cy="164" r="7" fill="#EAF2FF" stroke="#0877F9" stroke-width=".65"/><text x="39" y="166" text-anchor="middle" font-size="4.7" font-weight="700" fill="#0757C9">ML</text><text x="49" y="166" font-size="5.6" font-weight="650" fill="#34425A">Marina</text>
    <circle cx="124" cy="164" r="7" fill="#EAF2FF" stroke="#0877F9" stroke-width=".65"/><text x="124" y="166" text-anchor="middle" font-size="4.7" font-weight="700" fill="#0757C9">JN</text><text x="134" y="166" font-size="5.6" font-weight="650" fill="#34425A">João</text>
    <circle cx="201" cy="164" r="7" fill="#EAF2FF" stroke="#0877F9" stroke-width=".65"/><text x="201" y="166" text-anchor="middle" font-size="4.7" font-weight="700" fill="#0757C9">CR</text><text x="211" y="166" font-size="5.6" font-weight="650" fill="#34425A">Camila</text>
    <text x="300" y="166" text-anchor="end" font-size="5.2" fill="#0877F9">Hoje⌄</text>
  </g>
  <g stroke="#EFF2F7" stroke-width=".7"><line x1="24" y1="183" x2="305" y2="183"/><line x1="24" y1="207" x2="305" y2="207"/><line x1="24" y1="231" x2="305" y2="231"/><line x1="24" y1="255" x2="305" y2="255"/></g>
  <g class="time-advance"><g class="live-line"><line x1="52" y1="253" x2="305" y2="253" stroke="#1685FF" stroke-width="1.1"/><circle cx="305" cy="253" r="1.7" fill="#1685FF"/></g><g class="now-pill"><rect x="24" y="247" width="27" height="12" rx="6" fill="#0877F9"/><text x="37.5" y="255.2" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="5" font-weight="700" fill="#FFF">13:27</text></g></g>
  <g class="booking booking-1" filter="url(#cardShadow)"><rect x="25" y="174" width="278" height="22" rx="5.5" fill="url(#confirmedFill)" stroke="#DFEAFE"/><rect x="25" y="174" width="2.4" height="22" rx="1.2" fill="#1685FF"/><text x="33" y="183" font-family="Inter,system-ui,sans-serif" font-size="5.5" font-weight="750" fill="#17304F">09:00–09:45</text><text x="84" y="183" font-family="Inter,system-ui,sans-serif" font-size="5.8" font-weight="700" fill="#263751">Rafaela Lima</text><text x="84" y="191" font-family="Inter,system-ui,sans-serif" font-size="5.2" fill="#53627A">Marina · Corte clássico</text><rect x="261" y="178" width="36" height="10" rx="5" fill="#DCEBFF"/><text x="279" y="185" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="4.7" font-weight="700" fill="#0757C9">Confirmada</text></g>
  <g class="booking booking-2" filter="url(#cardShadow)"><rect x="25" y="198" width="278" height="22" rx="5.5" fill="url(#pendingFill)" stroke="#F5E4BB"/><rect x="25" y="198" width="2.4" height="22" rx="1.2" fill="#F3AD2E"/><text x="33" y="207" font-family="Inter,system-ui,sans-serif" font-size="5.5" font-weight="750" fill="#49371C">10:30–11:00</text><text x="84" y="207" font-family="Inter,system-ui,sans-serif" font-size="5.8" font-weight="700" fill="#554329">Breno Silva</text><text x="84" y="215" font-family="Inter,system-ui,sans-serif" font-size="5.2" fill="#655131">João · Barba</text><rect x="265" y="202" width="32" height="10" rx="5" fill="#FFE8B2"/><text x="281" y="209" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="4.7" font-weight="700" fill="#96600A">Agendada</text></g>
  <g class="booking booking-3" filter="url(#cardShadow)"><rect x="25" y="222" width="278" height="22" rx="5.5" fill="url(#altFill)" stroke="#EAD9FF"/><rect x="25" y="222" width="2.4" height="22" rx="1.2" fill="#B46AF2"/><text x="33" y="231" font-family="Inter,system-ui,sans-serif" font-size="5.5" font-weight="750" fill="#3D2C52">11:30–12:15</text><text x="84" y="231" font-family="Inter,system-ui,sans-serif" font-size="5.8" font-weight="700" fill="#493858">Maria Luiza</text><text x="84" y="239" font-family="Inter,system-ui,sans-serif" font-size="5.2" fill="#65566F">Camila · Unhas em gel</text><rect x="261" y="226" width="36" height="10" rx="5" fill="#DCEBFF"/><text x="279" y="233" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="4.7" font-weight="700" fill="#0757C9">Confirmada</text></g>
</svg>
