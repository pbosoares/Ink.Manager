<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F6FB"><meta name="robots" content="noindex,nofollow">
  <title>Atualizar agendamento — Marcaê</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700&amp;display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="/acao-email.js" defer></script>
</head>
<body class="public-booking">
  <div class="public-shell"><header class="landing-masthead"><a class="landing-logo" href="/">Marcaê<span aria-hidden="true"> ✦</span></a></header>
    <main id="email-action-main"><span class="eyebrow accent">SEU AGENDAMENTO</span><h1>Atualizar horário</h1>
      <p id="action-status" role="status">Verificando o link…</p><p id="action-error" class="form-error" role="alert"></p>
      <section id="action-details" class="booking-confirmation" hidden><dl id="action-summary"></dl>
        <form id="reschedule-form" hidden><label>Novo dia<input id="action-date" type="date" required></label><label>Novo horário<input id="action-time" type="time" step="900" required></label></form>
        <button id="action-submit" class="primary wide" type="button" disabled>Confirmar</button>
      </section>
    </main><footer class="landing-footer"><span>MAIS TEMPO PARA ATENDER BEM.</span><span>Marcaê</span></footer>
  </div>
</body>
</html>
