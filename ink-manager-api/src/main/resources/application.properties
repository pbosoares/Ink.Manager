spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ink_manager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET}
studio.registration-code=${STUDIO_REGISTRATION_CODE:}
studio.time-zone=${STUDIO_TIME_ZONE:America/Sao_Paulo}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.shutdown=graceful

server.error.include-message=never
server.error.include-stacktrace=never
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0

app.public-url=${PUBLIC_URL:http://localhost:8080}
app.email-from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

billing.monthly-amount=${BILLING_MONTHLY_AMOUNT:29.90}
billing.trial-days=${BILLING_TRIAL_DAYS:14}
billing.enforce=${BILLING_ENFORCE:true}
billing.mp-access-token=${MP_ACCESS_TOKEN:}
billing.mp-webhook-secret=${MP_WEBHOOK_SECRET:}
