name: ${INK_STUDIO_ID:?Defina um identificador unico para o estudio}
# Instalacao dedicada: nao combinar com o Compose de desenvolvimento.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  api:
    image: ink-manager:${INK_IMAGE_TAG:?Defina uma versao de release}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MARCAE_RETENTION_BIND_PORT:-18087}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:?Defina a URL publica HTTPS}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      BILLING_MONTHLY_AMOUNT: ${BILLING_MONTHLY_AMOUNT:-29.90}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-14}
      BILLING_ENFORCE: ${BILLING_ENFORCE:-true}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MARCAE_RETENTION_ENABLED: ${MARCAE_RETENTION_ENABLED:-false}
      MARCAE_WAITLIST_RETENTION_HOURS: ${MARCAE_WAITLIST_RETENTION_HOURS:-24}
      MARCAE_OPERATIONAL_RETENTION_DAYS: ${MARCAE_OPERATIONAL_RETENTION_DAYS:-30}
      MARCAE_RETENTION_OPERATOR_ID: ${MARCAE_RETENTION_OPERATOR_ID:-}
      MARCAE_RETENTION_OPERATOR_TOKEN: ${MARCAE_RETENTION_OPERATOR_TOKEN:-}
      MARCAE_CLOSURE_MANIFEST_PATH: ${MARCAE_CLOSURE_MANIFEST_PATH:-}
      MARCAE_CLOSURE_MANIFEST_KEY: ${MARCAE_CLOSURE_MANIFEST_KEY:-}
      MARCAE_CLOSURE_MANIFEST_BACKEND: ${MARCAE_CLOSURE_MANIFEST_BACKEND:-file}
      MARCAE_CLOSURE_GITHUB_OWNER: ${MARCAE_CLOSURE_GITHUB_OWNER:-}
      MARCAE_CLOSURE_GITHUB_REPOSITORY: ${MARCAE_CLOSURE_GITHUB_REPOSITORY:-}
      MARCAE_CLOSURE_GITHUB_BRANCH: ${MARCAE_CLOSURE_GITHUB_BRANCH:-main}
      MARCAE_CLOSURE_GITHUB_ANCHOR_BRANCH: ${MARCAE_CLOSURE_GITHUB_ANCHOR_BRANCH:-manifest-anchor}
      MARCAE_CLOSURE_GITHUB_PATH: ${MARCAE_CLOSURE_GITHUB_PATH:-manifest/closures.log}
      MARCAE_CLOSURE_GITHUB_TOKEN: ${MARCAE_CLOSURE_GITHUB_TOKEN:-}
      MARCAE_CLOSURE_MANIFEST_ALLOW_INITIALIZE: ${MARCAE_CLOSURE_MANIFEST_ALLOW_INITIALIZE:-false}
    depends_on:
      postgres: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      INK_DOMAIN: ${INK_DOMAIN:?Defina o dominio publico}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
